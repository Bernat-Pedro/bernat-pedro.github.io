<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airplane Logger</title>
  <style>
    :root {
      --bg: #07111d;
      --bg-2: #0f1a2a;
      --panel: rgba(12, 19, 31, 0.9);
      --panel-strong: rgba(16, 25, 40, 0.98);
      --line: rgba(255,255,255,0.12);
      --text: #edf4ff;
      --muted: #a9b6d3;
      --accent: #74d0ff;
      --accent-2: #ffd166;
      --danger: #ff8e8e;
      --success: #8fe3b5;
      --shadow: rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #17325a 0%, #0c1627 28%, var(--bg) 100%);
    }

    a { color: inherit; }

    .page-shell {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      padding: 10px 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: -0.04em;
      font-size: clamp(1.4rem, 3vw, 2rem);
      text-decoration: none;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .nav a, .nav button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    .primaryBtn {
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #5ec3ff);
      color: #041522;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(116,208,255,0.3);
    }

    .secondaryBtn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }

    .app {
      display: none;
    }

    .app.active {
      display: block;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: -0.06em;
    }

    .user-tag {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 16px 30px var(--shadow);
    }

    .panel h3 {
      margin: 0 0 18px;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .field label, .field span {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font: inherit;
    }

    .field input:focus {
      outline: 2px solid rgba(116,208,255,0.35);
      border-color: var(--accent);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .search-results { display: flex; flex-wrap: wrap; gap: 8px; min-height: 24px; max-height: 280px; overflow-y: auto; margin-top: 4px; padding: 2px; }

    .search-pill {
      border: 1px solid rgba(116,208,255,0.5);
      background: rgba(116,208,255,0.12);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .meta-note {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
    }

    .status {
      min-height: 20px;
      margin-top: 16px;
      color: var(--success);
      font-size: 0.9rem;
    }

    .status.error {
      color: var(--danger);
    }

    .entries-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .entry {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
    }

    .entry strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1.02rem;
    }

    .entry small {
      display: block;
      color: var(--muted);
    }

    .entry-meta {
      text-align: right;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .delete-entry {
      margin-top: 8px;
      border: 1px solid rgba(255,142,142,0.45);
      border-radius: 999px;
      padding: 6px 10px;
      background: transparent;
      color: var(--danger);
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .empty-state {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .entry { display: grid; }
      .entry-meta { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="index.html">Airplane Logger</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="eclipse.html">Eclipse</a>
        <button id="logoutBtn" type="button" class="secondaryBtn">Log out</button>
      </nav>
    </header>

    <main id="app" class="app" aria-live="polite">
      <div class="hero">
        <h1>Airplane sightings</h1>
        <div id="userTag" class="user-tag">Signed in as guest</div>
      </div>

      <div class="grid">
        <section class="panel" aria-label="Add a new airplane log">
          <h3>New sighting</h3>
          <div class="field">
            <label for="registrationInput">Registration number</label>
            <input id="registrationInput" type="text" maxlength="20" placeholder="e.g. EC-MKI, Air Europa, or Iberia" autocapitalize="characters" />
            <div id="searchResults" class="search-results" aria-live="polite"></div>
            <span class="meta-note">Search includes the FAA registry, public Air Europa/Iberia registration indexes, and live ADS-B data.</span>
          </div>

          <div class="field">
            <label for="operatorInput">Airline or owner</label>
            <input id="operatorInput" type="text" placeholder="e.g. American Airlines" />
          </div>

          <div class="field">
            <span>Date and time of sighting</span>
            <div class="field-row">
              <input id="sightingDate" type="date" />
              <input id="sightingTime" type="time" />
            </div>
          </div>

          <div class="row-actions">
            <button id="saveEntryBtn" type="button" class="primaryBtn" style="width:auto; min-width:180px;">Add log entry</button>
          </div>
          <div id="statusMessage" class="status" aria-live="polite"></div>
        </section>

        <aside class="panel" aria-label="Existing airplane logs">
          <h3>Saved logs <small style="color:var(--muted);font-weight:400;">Local database</small></h3>
          <ul id="entriesList" class="entries-list"></ul>
        </aside>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const GMAIL_RE = /^[a-z0-9._%+\-]+@gmail\.com$/i;
      const STORAGE_KEYS = {
        googleUser: 'google-user-email',
        logs: 'airplane-logger-database',
        registry: 'airplane-logger-faa-registry',
        airlineRegistry: 'airplane-logger-airline-registry'
      };

      const FAA_REGISTRY_URL = 'https://raw.githubusercontent.com/rparenton/dump1090-registry-tools/master/faa_registry.csv';
      const AIRLINE_INDEX_QUERIES = {
        'Air Europa': 'Air Europa aircraft EC-',
        'Iberia': 'Iberia aircraft EC-'
      };
      const airlineFallbackRows = [
        ...['EC-MJU', 'EC-MQP', 'EC-MXM', 'EC-MUZ', 'EC-NFM', 'EC-NGS', 'EC-NUY', 'EC-NUZ', 'EC-NVJ', 'EC-NVQ', 'EC-NZR', 'EC-LTM', 'EC-LVR', 'EC-MAJ', 'EC-MHL', 'EC-MIG', 'EC-MKL', 'EC-MPG', 'EC-MTI'].map((registration) => ({ registration, airline: 'Air Europa', source: 'Public fleet index' })),
        ...['EC-MBU', 'EC-MCB', 'EC-MCS', 'EC-MDK', 'EC-MEG', 'EC-MEH', 'EC-MFO', 'EC-MKI', 'EC-MKJ', 'EC-MLC', 'EC-MLP', 'EC-MMG', 'EC-MNL', 'EC-MNR', 'EC-MOU', 'EC-MUF', 'EC-MXU', 'EC-MXY', 'EC-MYA', 'EC-NAZ', 'EC-NCM', 'EC-NDN', 'EC-NDR', 'EC-NER', 'EC-NGP', 'EC-NIF', 'EC-NJI', 'EC-NJU', 'EC-NJY', 'EC-NMZ', 'EC-NTI', 'EC-NTO', 'EC-NTP', 'EC-NVS', 'EC-NZP', 'EC-NZQ'].map((registration) => ({ registration, airline: 'Iberia', source: 'Public fleet index' })),
        ...[
          ['EC-OIL', 'A321-253NY(XLR)'], ['EC-OLE', 'A321-253NY(XLR)'], ['EC-ONR', 'A321-253NY(XLR)'], ['EC-OOJ', 'A321-253NY(XLR)'], ['EC-OQG', 'A321-253NY(XLR)'], ['EC-OQH', 'A321-253NY(XLR)'], ['EC-ORE', 'A321-253NY(XLR)'], ['EC-ORZ', 'A321-253NY(XLR)'],
          ['EC-KHM', 'A319-111'], ['EC-KUB', 'A319-111'], ['EC-LEI', 'A319-111'],
          ['EC-IEF', 'A320-214'], ['EC-IEG', 'A320-214'], ['EC-ILS', 'A320-214'], ['EC-IZH', 'A320-214'], ['EC-IZR', 'A320-214'], ['EC-LRG', 'A320-214'], ['EC-LUL', 'A320-216'], ['EC-LVD', 'A320-216'], ['EC-LXQ', 'A320-216'], ['EC-MCS', 'A320-214'],
          ['EC-HUH', 'A321-212'], ['EC-HUI', 'A321-212'], ['EC-ILP', 'A321-213'], ['EC-IXD', 'A321-212'], ['EC-JDM', 'A321-213'], ['EC-JDR', 'A321-213'], ['EC-JEJ', 'A321-213'], ['EC-JGS', 'A321-213'], ['EC-JLI', 'A321-213'], ['EC-JQZ', 'A321-212'], ['EC-JRE', 'A321-212'], ['EC-JZM', 'A321-212'],
          ['EC-MKI', 'A330-202'], ['EC-MKJ', 'A330-202'], ['EC-MLB', 'A330-202'], ['EC-MLP', 'A330-202'], ['EC-MMG', 'A330-202'], ['EC-MNK', 'A330-202'], ['EC-MNL', 'A330-202'], ['EC-MOU', 'A330-202'], ['EC-MOY', 'A330-202'], ['EC-MSY', 'A330-202'], ['EC-MUD', 'A330-202'], ['EC-MYA', 'A330-202'],
          ['EC-LUB', 'A330-302'], ['EC-LLK', 'A330-302'], ['EC-LUX', 'A330-302'], ['EC-LXK', 'A330-302'], ['EC-LYF', 'A330-302'], ['EC-LZJ', 'A330-302'], ['EC-LZX', 'A330-302'], ['EC-MAA', 'A330-302'],
          ['EC-MXV', 'A350-941'], ['EC-MYX', 'A350-941'], ['EC-NBE', 'A350-941'], ['EC-NCX', 'A350-941'], ['EC-NDR', 'A350-941'], ['EC-NGT', 'A350-941'], ['EC-NIG', 'A350-941'], ['EC-NIS', 'A350-941'], ['EC-NJM', 'A350-941'], ['EC-NLP', 'A350-941'], ['EC-NMZ', 'A350-941'], ['EC-NSC', 'A350-941'], ['EC-NVR', 'A350-941'], ['EC-NXC', 'A350-941'], ['EC-NXD', 'A350-941'],
          ['EC-LIT', 'CRJ-1000'], ['EC-LJX', 'CRJ-1000'], ['EC-LKF', 'CRJ-1000EL'], ['EC-LQJ', 'CRJ-1000'], ['EC-LOV', 'CRJ-1000'], ['EC-LOX', 'CRJ-1000'], ['EC-LPG', 'CRJ-1000'], ['EC-LPN', 'CRJ-1000'], ['EC-MJO', 'CRJ-1000'], ['EC-MJP', 'CRJ-1000'], ['EC-MJQ', 'CRJ-1000'], ['EC-MLC', 'CRJ-1000'], ['EC-MLN', 'CRJ-1000'], ['EC-MLO', 'CRJ-1000'], ['EC-MNQ', 'CRJ-1000'], ['EC-MNR', 'CRJ-1000'], ['EC-MOX', 'CRJ-1000'], ['EC-MPA', 'CRJ-1000'], ['EC-MQQ', 'CRJ-1000'], ['EC-MRI', 'CRJ-1000'], ['EC-MSB', 'CRJ-1000'], ['EC-MSL', 'CRJ-1000'], ['EC-MTO', 'CRJ-1000'], ['EC-MTZ', 'CRJ-1000'], ['EC-MUG', 'CRJ-1000'], ['EC-MVC', 'CRJ-1000'], ['EC-MVZ', 'CRJ-1000'], ['EC-MXA', 'CRJ-1000'], ['EC-OOQ', 'CRJ-1000EL'], ['EC-OOR', 'CRJ-1000EL'], ['EC-OSN', 'CRJ-1000'], ['EC-OTF', 'CRJ-1000'], ['EC-OTG', 'CRJ-1000']
        ].map(([registration, type]) => ({ registration, type, airline: 'Iberia', source: 'Screenshot fleet index' })),
        ...[
          ['EC-OGS', '737 MAX 8'], ['EC-OPA', '737 MAX 8'], ['EC-OPY', '737 MAX 8'], ['EC-OPZ', '737 MAX 8'], ['EC-ORI', '737 MAX 8'], ['EC-ORK', '737 MAX 8'], ['EC-OSS', '737 MAX 8'], ['EC-OTA', '737 MAX 8'], ['EC-OTG', '737 MAX 8'],
          ['EC-LPQ', '737-85P'], ['EC-LPR', '737-85P'], ['EC-LQX', '737-85P'], ['EC-LTM', '737-85P'], ['EC-LUT', '737-85P'], ['EC-LVR', '737-85P'], ['EC-LXV', '737-85P'], ['EC-MJU', '737-85P'], ['EC-MKL', '737-85P'], ['EC-MPG', '737-85P'], ['EC-MPS', '737-85P'], ['EC-MQP', '737-85P'], ['EC-MUZ', '737-85P'], ['EC-MNV', '737-85P'], ['EC-MNW', '737-85P'], ['EC-NUZ', '737-8GP'], ['EC-NVP', '737-8AS'], ['EC-NVQ', '737-8AS'], ['EC-NZN', '737-8KN'], ['EC-NZR', '737-8AS'], ['EC-OBJ', '737-8JG'], ['EC-OBK', '737-8JG'], ['EC-OBP', '737-8JP'],
          ['EC-MIG', '787-8'], ['EC-MIH', '787-8'], ['EC-MLT', '787-8'], ['EC-MMX', '787-8'], ['EC-MMY', '787-8'], ['EC-MNS', '787-8'], ['EC-MOM', '787-8'], ['EC-MPE', '787-8'], ['EC-NVZ', '787-8'], ['EC-NXA', '787-8'], ['EC-NZG', '787-8'],
          ['EC-MSZ', '787-9'], ['EC-MTI', '787-9'], ['EC-NBM', '787-9'], ['EC-NBX', '787-9'], ['EC-NCY', '787-9'], ['EC-NEI', '787-9'], ['EC-NFM', '787-9'], ['EC-NGM', '787-9'], ['EC-NGN', '787-9'], ['EC-NGS', '787-9'], ['EC-ODH', '787-9'], ['EC-ODI', '787-9'], ['EC-OEM', '787-9'], ['EC-OFO', '787-9'], ['EC-OFP', '787-9'], ['EC-OGY', '787-9'], ['EC-OMB', '787-9'], ['EC-OMC', '787-9']
        ].map(([registration, type]) => ({ registration, type, airline: 'Air Europa', source: 'Screenshot fleet index' }))
      ];

      const aircraftDatabase = [
        { registration: 'N123AA', airline: 'American Airlines', owner: 'American Airlines' },
        { registration: 'N456UA', airline: 'United Airlines', owner: 'United Airlines' },
        { registration: 'G-EZTH', airline: 'EasyJet', owner: 'EasyJet UK' },
        { registration: 'EC-LTV', airline: 'Iberia', owner: 'Iberia' },
        { registration: 'D-AIJK', airline: 'Lufthansa', owner: 'Lufthansa' },
        { registration: '9H-ABC', airline: 'Malta Air', owner: 'Aviation Holdings' },
        { registration: 'VP-CBA', airline: 'British Airways', owner: 'International Airlines Group' },
        { registration: 'A7-AHQ', airline: 'Qatar Airways', owner: 'Qatar Airways' },
        { registration: 'HB-JAN', airline: 'Swiss International Air Lines', owner: 'Swiss' },
        { registration: 'F-GRNE', airline: 'Air France', owner: 'Air France' },
        { registration: 'OE-LDM', airline: 'Austrian Airlines', owner: 'Austrian Airlines' },
        { registration: 'PH-BGA', airline: 'KLM', owner: 'KLM Royal Dutch Airlines' },
        { registration: 'B-1234', airline: 'China Southern Airlines', owner: 'China Southern Airlines' },
        { registration: 'CN-RNB', airline: 'Royal Air Maroc', owner: 'Royal Air Maroc' },
        { registration: 'VH-OQA', airline: 'Qantas', owner: 'Qantas Airways' },
        { registration: 'OO-JDG', airline: 'Brussels Airlines', owner: 'Lufthansa Group' },
        { registration: 'XA-XYZ', airline: 'Aeromexico', owner: 'Aeromexico' },
        { registration: 'D-ABCD', airline: 'Deutsche Lufthansa', owner: 'Lufthansa' }
      ];

      const elements = {
        app: document.getElementById('app'),
        userTag: document.getElementById('userTag'),
        logoutBtn: document.getElementById('logoutBtn'),
        registrationInput: document.getElementById('registrationInput'),
        operatorInput: document.getElementById('operatorInput'),
        sightingDate: document.getElementById('sightingDate'),
        sightingTime: document.getElementById('sightingTime'),
        searchResults: document.getElementById('searchResults'),
        saveEntryBtn: document.getElementById('saveEntryBtn'),
        statusMessage: document.getElementById('statusMessage'),
        entriesList: document.getElementById('entriesList')
      };

      let currentUser = '';
      let entries = [];
      let searchTimer = null;
      let searchController = null;
      const liveAircraftCache = new Map();
      let faaRegistryRows = null;
      let faaRegistryPromise = null;
      let airlineRegistryRows = null;
      let airlineRegistryPromise = null;

      function getCurrentUser() {
          const user = sessionStorage.getItem(STORAGE_KEYS.googleUser);
        return user && GMAIL_RE.test(user) ? user.toLowerCase() : '';
      }

      function readEntries() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.logs) || '{}');
          if (saved && saved.version === 1 && saved.sightingsByUser) {
            return saved.sightingsByUser;
          }

          // Migrate the earlier unversioned per-user log object once.
          if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
            const migrated = { ...saved };
            localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify({
              version: 1,
              createdAt: new Date().toISOString(),
              sightingsByUser: migrated
            }));
            return migrated;
          }
        } catch (error) {
          return {};
        }
        return {};
      }

      function persistEntries() {
        localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify({
          version: 1,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          sightingsByUser: entries
        }));
      }

      function setStatus(message, isError = false) {
        elements.statusMessage.textContent = message;
        elements.statusMessage.classList.toggle('error', isError);
      }

      function normalizeRegistration(input) {
        return String(input || '').toUpperCase().replace(/[^A-Z0-9-]/g, '');
      }

      function readCachedRegistry() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.registry) || 'null');
          return Array.isArray(saved) ? saved : null;
        } catch (error) {
          return null;
        }
      }

      function parseRegistry(csv) {
        return csv.split(/\r?\n/).map((line) => {
          const fields = line.split(',');
          return { registration: normalizeRegistration(fields[1]), type: String(fields[2] || '').trim() };
        }).filter((plane) => plane.registration);
      }

      async function loadFaaRegistry() {
        if (faaRegistryRows) return faaRegistryRows;
        const cached = readCachedRegistry();
        if (cached) {
          faaRegistryRows = cached;
          return faaRegistryRows;
        }
        if (!faaRegistryPromise) {
          faaRegistryPromise = fetch(FAA_REGISTRY_URL, { headers: { Accept: 'text/csv' } })
            .then((response) => {
              if (!response.ok) throw new Error(`FAA registry returned HTTP ${response.status}`);
              return response.text();
            })
            .then((csv) => {
              faaRegistryRows = parseRegistry(csv);
              try {
                localStorage.setItem(STORAGE_KEYS.registry, JSON.stringify(faaRegistryRows));
              } catch (error) {
                // Keep the registry in memory when browser storage is full.
              }
              return faaRegistryRows;
            });
        }
        return faaRegistryPromise;
      }

      function readCachedAirlineRegistry() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.airlineRegistry) || 'null');
          return Array.isArray(saved) ? saved : null;
        } catch (error) {
          return null;
        }
      }

      async function loadAirlineRegistry() {
        if (airlineRegistryRows?.length) return airlineRegistryRows;
        const cached = readCachedAirlineRegistry();
        if (cached?.length) {
          airlineRegistryRows = [...cached, ...airlineFallbackRows];
          return airlineRegistryRows;
        }
        if (!airlineRegistryPromise) {
          airlineRegistryPromise = Promise.all(Object.entries(AIRLINE_INDEX_QUERIES).map(async ([airline, search]) => {
            const url = `https://commons.wikimedia.org/w/api.php?action=query&list=search&srnamespace=6&srlimit=500&format=json&srsearch=${encodeURIComponent(search)}`;
            const response = await fetch(url, { headers: { Accept: 'application/json' } });
            if (!response.ok) throw new Error(`Wikimedia returned HTTP ${response.status}`);
            const payload = await response.json();
            const rows = payload?.query?.search || [];
            const registrations = new Set();
            rows.forEach((row) => {
              String(row.title || '').match(/EC-[A-Z0-9]{3,4}/gi)?.forEach((registration) => registrations.add(registration.toUpperCase()));
            });
            return [...registrations].map((registration) => ({ registration, airline, source: 'Public fleet index' }));
          })).then((groups) => {
            airlineRegistryRows = [...groups.flat(), ...airlineFallbackRows];
            try {
              localStorage.setItem(STORAGE_KEYS.airlineRegistry, JSON.stringify(airlineRegistryRows));
            } catch (error) {
              // Keep the index in memory when browser storage is full.
            }
            return airlineRegistryRows;
          });
        }
        return airlineRegistryPromise;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function seedDateTime() {
        const now = new Date();
        elements.sightingDate.value = now.toISOString().slice(0, 10);
        elements.sightingTime.value = now.toTimeString().slice(0, 5);
      }

      function currentUserEntries() {
        return entries[currentUser] || [];
      }

      function saveCurrentUserEntries(list) {
        entries[currentUser] = list;
        persistEntries();
      }

      function renderEntries() {
        const list = currentUserEntries();
        if (!list.length) {
          elements.entriesList.innerHTML = '<li class="empty-state">No airplane sightings logged yet. Your entries will appear here.</li>';
          return;
        }

        const sorted = [...list].sort((a, b) => new Date(b.loggedAt) - new Date(a.loggedAt));
        elements.entriesList.innerHTML = sorted.map((entry) => {
          const seenAt = new Date(`${entry.date}T${entry.time || '00:00'}`);
          const formatted = Number.isNaN(seenAt.getTime()) ? entry.date : seenAt.toLocaleString([], {
            dateStyle: 'medium',
            timeStyle: 'short'
          });

          return `
            <li class="entry">
              <div>
                <strong>${escapeHtml(entry.registration)}</strong>
                <small>${escapeHtml([entry.callsign, entry.operator, entry.aircraftType].filter(Boolean).join(' · ') || 'Unknown aircraft')}</small>
              </div>
              <div class="entry-meta">
                <span>${escapeHtml(formatted)}</span>
                <button type="button" class="delete-entry" data-entry-id="${escapeHtml(entry.id)}">Delete</button>
              </div>
            </li>
          `;
        }).join('');
      }

      function filterLocalAircraft(query) {
        const value = String(query || '').trim().toLowerCase();
        if (!value) return [];

        return aircraftDatabase.filter((plane) => {
          return plane.registration.toLowerCase().includes(value) ||
            plane.airline.toLowerCase().includes(value) ||
            plane.owner.toLowerCase().includes(value);
        }).slice(0, 6);
      }

      function filterFaaRegistry(query) {
        if (!faaRegistryRows) return [];
        const value = normalizeRegistration(query);
        return faaRegistryRows.filter((plane) => plane.registration.includes(value)).slice(0, 6).map((plane) => ({
          registration: plane.registration,
          airline: '',
          owner: plane.type ? `FAA registry · ${plane.type}` : 'FAA registry',
          source: 'FAA registry'
        }));
      }

      function filterAirlineRegistry(query, searchText = '') {
        const rows = airlineRegistryRows?.length ? airlineRegistryRows : airlineFallbackRows;
        const value = normalizeRegistration(query);
        const text = String(searchText || '').trim().toLowerCase();
        const matches = rows.filter((plane) => (value && plane.registration.includes(value)) || plane.airline.toLowerCase().includes(text));
        const uniqueRows = new Map();
        matches.forEach((plane) => {
          const key = normalizeRegistration(plane.registration);
          const existing = uniqueRows.get(key);
          if (!existing || (!existing.type && plane.type)) uniqueRows.set(key, plane);
        });
        return [...uniqueRows.values()].map((plane) => ({
          registration: plane.registration,
          airline: plane.airline,
          owner: plane.type ? `${plane.airline} · ${plane.type}` : 'Public fleet index',
          type: plane.type || '',
          callsign: plane.airline === 'Air Europa' ? 'AEA' : plane.airline === 'Iberia' ? 'IBE' : '',
          source: 'Public fleet index'
        }));
      }

      function isRegistrationFormat(value) {
        const normalized = String(value || '').trim();
        if (!normalized) return false;
        if (!/^[A-Z0-9-]+$/i.test(normalized)) return false;
        if (normalized.startsWith('-') || normalized.endsWith('-')) return false;
        if (normalized.split('-').some((part) => part.length === 0)) return false;
        return normalized.length >= 2 && normalized.length <= 12 && /^[A-Z0-9]+(?:-[A-Z0-9]+)?$/i.test(normalized);
      }

      function findKnownRegistration(registration, liveResults = []) {
        const value = normalizeRegistration(registration);
        const known = [
          ...aircraftDatabase,
          ...filterFaaRegistry(value),
          ...filterAirlineRegistry(value),
          ...liveResults
        ];
        return known.find((plane) => normalizeRegistration(plane.registration) === value) || null;
      }

      function renderSearchResults(localResults, liveResults = [], message = '') {
        const results = [...localResults, ...liveResults];

        if (!results.length) {
          elements.searchResults.innerHTML = `<span class="meta-note">${escapeHtml(message || 'No live match found. You can still save the registration manually.')}</span>`;
          return;
        }

        elements.searchResults.innerHTML = results.map((plane) => {
          const label = plane.airline || plane.owner || 'Unknown operator';
          const source = plane.source === 'OpenSky'
            ? `OpenSky callsign · ${plane.lastSeen || 'live'}`
            : [plane.callsign, label, plane.type].filter(Boolean).join(' · ');
          return `<button type="button" class="search-pill" data-registration="${escapeHtml(plane.registration)}" data-operator="${escapeHtml(label)}">${escapeHtml(plane.registration)} · ${escapeHtml(source)}</button>`;
        }).join('');
      }

      async function fetchLiveAircraft(query) {
        const value = normalizeRegistration(query);
        const cached = liveAircraftCache.get(value);
        if (cached && Date.now() - cached.fetchedAt < 30000) return cached.results;

        if (searchController) searchController.abort();
        searchController = new AbortController();
        const timeout = setTimeout(() => searchController.abort(), 10000);
        try {
          const response = await fetch(`https://api.adsb.lol/v2/registration/${encodeURIComponent(value)}`, {
            signal: searchController.signal,
            headers: { Accept: 'application/json' }
          });
          if (!response.ok) throw new Error(`ADS-B endpoint returned HTTP ${response.status}`);
          const payload = await response.json();
          const results = (Array.isArray(payload.ac) ? payload.ac : []).slice(0, 6).map((aircraft) => ({
            registration: String(aircraft.r || value).trim().toUpperCase(),
            airline: String(aircraft.airline || '').trim(),
            owner: String(aircraft.ownop || '').trim(),
            source: 'ADS-B live',
            lastSeen: aircraft.now ? new Date(aircraft.now * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'live'
          }));
          liveAircraftCache.set(value, { fetchedAt: Date.now(), results });
          return results;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function updateSearchResults() {
        const searchText = String(elements.registrationInput.value || '').trim();
        const query = normalizeRegistration(searchText);
        const localResults = [...filterLocalAircraft(searchText), ...filterFaaRegistry(query), ...filterAirlineRegistry(query, searchText)];

        if (!searchText) {
          elements.searchResults.innerHTML = '';
          return;
        }

        const initialResults = [...filterLocalAircraft(searchText), ...filterFaaRegistry(query), ...filterAirlineRegistry(query, searchText)];
        renderSearchResults(initialResults, [], 'Searching public registries and live ADS-B traffic…');

        let liveResults = [];
        let liveUnavailable = false;

        try {
          await Promise.all([loadFaaRegistry(), loadAirlineRegistry()]);
        } catch (error) {
          // Public registry loading can fail without blocking local results.
        }

        if (normalizeRegistration(elements.registrationInput.value) !== query) return;

        try {
          liveResults = /^[A-Z0-9-]+$/i.test(searchText) ? await fetchLiveAircraft(query) : [];
        } catch (error) {
          if (error.name === 'AbortError') return;
          liveUnavailable = true;
        }

        if (normalizeRegistration(elements.registrationInput.value) !== query) return;
        const registryResults = [...filterLocalAircraft(searchText), ...filterFaaRegistry(query), ...filterAirlineRegistry(query, searchText)];
        renderSearchResults(registryResults, liveResults, liveUnavailable ? 'Live data is unavailable right now. Public registry matches remain available.' : 'No matching aircraft found.');
        if (isRegistrationFormat(query)) {
          const match = findKnownRegistration(query, liveResults);
          const statusText = match
            ? `${query} is recognized as a valid registration.`
            : `${query} is a valid format, but it was not found in the available registries.`;
          setStatus(statusText, false);
        } else if (query) {
          setStatus(`${query} is not a valid aircraft registration format.`, true);
        }
      }

      function showApp() {
        elements.app.classList.add('active');
        elements.userTag.textContent = `Signed in as ${currentUser}`;
        elements.logoutBtn.style.display = 'inline-flex';
        renderEntries();
      }

      function handleLogout() {
        currentUser = '';
          sessionStorage.removeItem(STORAGE_KEYS.googleUser);
        window.location.replace('login.html?next=airplane.html');
      }

      async function handleSaveEntry() {
        const registration = normalizeRegistration(elements.registrationInput.value);
        const operator = (elements.operatorInput.value || '').trim();
        const date = elements.sightingDate.value;
        const time = elements.sightingTime.value;

        if (!registration) {
          setStatus('Please enter an aircraft registration number.', true);
          elements.registrationInput.focus();
          return;
        }

        if (!isRegistrationFormat(registration)) {
          setStatus('This registration format is invalid. Use formats like EC-MJU, N123AA, or B-1234.', true);
          elements.registrationInput.focus();
          return;
        }

        try {
          await Promise.all([loadFaaRegistry(), loadAirlineRegistry()]);
        } catch (error) {
          // Built-in and already loaded sources can still validate registrations.
        }

        const match = findKnownRegistration(registration);
        const matching = aircraftDatabase.find((plane) => plane.registration.toUpperCase() === registration);
        const finalOperator = operator || (matching ? (matching.airline || matching.owner) : match?.airline || match?.owner || 'Unknown operator');
        const userLogs = currentUserEntries();

        const log = {
          id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          registration,
          operator: finalOperator,
          callsign: match?.callsign || (match?.airline === 'Air Europa' ? 'AEA' : match?.airline === 'Iberia' ? 'IBE' : ''),
          aircraftType: match?.type || '',
          date: date || new Date().toISOString().slice(0, 10),
          time: time || '00:00',
          loggedAt: new Date().toISOString()
        };

        userLogs.unshift(log);
        saveCurrentUserEntries(userLogs);
        renderEntries();

        elements.registrationInput.value = '';
        elements.operatorInput.value = '';
        seedDateTime();
        elements.searchResults.innerHTML = '';
        setStatus(match ? `Saved log for ${registration}.` : `Saved manual log for ${registration}. The registration was not found in the available registries.`);
      }

      function handleDeleteEntry(event) {
        const button = event.target.closest('.delete-entry');
        if (!button) return;

        const entryId = button.dataset.entryId;
        const remaining = currentUserEntries().filter((entry) => entry.id !== entryId);
        saveCurrentUserEntries(remaining);
        renderEntries();
        setStatus('Saved log deleted.');
      }

      elements.logoutBtn.addEventListener('click', handleLogout);
      elements.saveEntryBtn.addEventListener('click', handleSaveEntry);
      elements.entriesList.addEventListener('click', handleDeleteEntry);
      elements.registrationInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(updateSearchResults, 600);
      });
      elements.registrationInput.addEventListener('blur', () => {
        elements.registrationInput.value = normalizeRegistration(elements.registrationInput.value);
        clearTimeout(searchTimer);
        updateSearchResults();
      });

      elements.searchResults.addEventListener('click', (event) => {
        const button = event.target.closest('.search-pill');
        if (!button) return;
        elements.registrationInput.value = normalizeRegistration(button.dataset.registration || '');
        elements.operatorInput.value = button.dataset.operator || '';
        elements.searchResults.innerHTML = '';
      });

      currentUser = getCurrentUser();
      entries = readEntries();

      if (!currentUser) {
        window.location.replace('login.html?next=airplane.html');
        return;
      }

      showApp();

      seedDateTime();
      renderEntries();
    })();
  </script>
</body>
</html>
