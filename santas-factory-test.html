<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Traveling to Santa's Factory</title>
  <link rel="icon" href="favicon-christmas-gift.svg" type="image/svg+xml">
  <link rel="stylesheet" href="santas-factory.css">
  <style>
    :root {
      color-scheme: dark;
      --wall: #173a33;
      --pine: #0c2622;
      --cream: #fff3da;
      --gold: #efbd72;
    }
    body {
      display: grid;
      grid-template-rows: minmax(230px, 1fr) auto;
      min-height: 100svh;
      margin: 0;
      color: var(--cream);
      background:
        repeating-linear-gradient(90deg, transparent 0 71px, #081f1a42 72px 74px),
        radial-gradient(ellipse at 50% 18%, #31574a, var(--wall) 45%, var(--pine) 82%);
      font: 1rem Georgia, 'Times New Roman', serif;
    }
    main { align-self: center; padding: 32px 18px 16px; text-align: center; }
    h1 { margin: 0 0 18px; font-size: 3.75rem; line-height: 1.05; }
    .factory-link { display: inline-block; padding: 5px 8px; }
    .factory-badge { font-family: system-ui, sans-serif; }
    .travel-timer { margin: 0 0 18px; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .home-link { color: var(--gold); text-underline-offset: .25em; }
    .home-link:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    .workshop {
      position: relative;
      min-height: clamp(220px, 43vw, 535px);
      overflow: hidden;
      pointer-events: none;
    }
    .workshop svg {
      position: absolute;
      bottom: 0;
      left: 50%;
      display: block;
      width: max(100%, 500px);
      max-width: 1280px;
      height: auto;
      opacity: .8;
      transform: translateX(-50%);
    }
    .belt-treads { animation: belt-roll 2s linear infinite; }
    .belt-gifts { animation: gift-travel 8s linear infinite; }
    .workshop-arm { transform-box: view-box; }
    .builder-arm { transform-origin: 12px -34px; animation: hammer 1.2s ease-in-out infinite alternate; }
    .packer-arm { transform-origin: 12px -34px; animation: pack 1.8s ease-in-out infinite alternate; }
    .sorter-arm { transform-origin: 12px -34px; animation: sort 2.4s ease-in-out infinite alternate; }
    .tree-lights { animation: twinkle 2.4s ease-in-out infinite alternate; }
    @keyframes belt-roll { to { transform: translateX(44px); } }
    @keyframes gift-travel { to { transform: translateX(176px); } }
    @keyframes hammer { from { transform: rotate(-32deg); } to { transform: rotate(12deg); } }
    @keyframes pack { from { transform: rotate(-18deg); } to { transform: rotate(32deg); } }
    @keyframes sort { from { transform: rotate(-22deg); } to { transform: rotate(20deg); } }
    @keyframes twinkle { to { opacity: .45; } }
    @media (max-width: 520px) {
      h1 { font-size: 2.3rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .belt-treads, .belt-gifts, .workshop-arm, .tree-lights { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Traveling to Santa's Factory</h1>
    <p class="travel-timer" id="travel-timer" role="timer" hidden>Arriving in <span>10</span>s</p>
    <noscript><p><a class="home-link" href="christmas-game.html">Enter Santa's Factory</a></p></noscript>
    <a class="home-link" href="index.html">Back to home</a>
    <script>
      const travelTimer = document.getElementById('travel-timer');
      const travelSeconds = travelTimer.querySelector('span');
      const arrival = performance.now() + 10000;

      function updateTravelTimer() {
        const remaining = arrival - performance.now();
        if (remaining <= 0) {
          window.location.replace('christmas-game.html');
          return;
        }
        const seconds = Math.ceil(remaining / 1000);
        travelSeconds.textContent = seconds;
        window.setTimeout(updateTravelTimer, remaining - (seconds - 1) * 1000);
      }

      travelTimer.hidden = false;
      updateTravelTimer();
    </script>
  </main>
