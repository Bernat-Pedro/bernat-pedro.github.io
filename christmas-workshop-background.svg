<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 295" id="still">
  <style>
    .gifts { animation: travel 7s linear infinite; }
    .treads { animation: travel 7s linear infinite; }
    .arm { transform-origin: 12px -29px; animation: work 1.3s ease-in-out infinite alternate; }
    .wrap { animation-duration: 1.9s; animation-delay: -.6s; }
    .check { animation-duration: 2.4s; animation-delay: -1s; }
    .lights { animation: glow 2.8s ease-in-out infinite alternate; }
    @keyframes travel { to { transform: translateX(152px); } }
    @keyframes work { from { transform: rotate(-24deg); } to { transform: rotate(20deg); } }
    @keyframes glow { to { opacity: .45; } }
    #still:target :is(.gifts, .treads, .arm, .lights) { animation: none; }
    @media (prefers-reduced-motion: reduce) { .gifts, .treads, .arm, .lights { animation: none; } }
  </style>
